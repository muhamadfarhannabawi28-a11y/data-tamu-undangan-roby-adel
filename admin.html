<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin — Roby & Adel</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="top"><a href="index.html">Roby <i>&</i> Adel</a><div><a href="index.html">Lihat Website ↗</a><button id="logoutButton" class="outline">Keluar</button></div></nav><main class="container admin"><section class="intro"><p class="eyebrow">PANEL PENGELOLAAN</p><h2>Dashboard Admin</h2><p>Kelola data tamu undangan Roby & Adel.</p></section><section class="stats"><article><span>Total Tamu</span><strong id="totalGuests">—</strong></article><article><span>Total Nominal</span><strong id="totalNominal">—</strong></article><article><span>Total Beras</span><strong id="totalRice">—</strong></article></section><section class="panel"><p class="eyebrow">FORMULIR DATA</p><h2 id="formTitle">Tambah Tamu</h2><form id="guestForm" class="guest-form"><input id="guestId" type="hidden"><label>Nama tamu<input id="guestName" maxlength="160" required></label><label>Alamat<input id="guestAddress" maxlength="300" required></label><label>Nominal (Rp)<input id="guestNominal" type="number" min="0" step="1" required></label><label>Beras (liter) · Opsional<input id="guestRice" type="number" min="0" step="0.1" placeholder="Kosongkan jika tidak ada"></label><div class="actions"><button id="saveButton" class="primary">Simpan Data</button><button id="cancelEdit" type="button" class="outline" hidden>Batal Edit</button></div><p id="formMessage" class="message"></p></form></section><section class="panel"><div class="panel-head"><h2>Semua Data Tamu</h2><small id="recordCount"></small></div><input id="searchInput" class="search" placeholder="Cari nama atau alamat…" type="search"><div class="table-wrap"><table><thead><tr><th>No.</th><t
